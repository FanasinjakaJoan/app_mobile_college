name: app_mobile_college
description: "Application mobile du collège : catalogue des cours du semestre, synchronisé avec l'API Express/TypeScript."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Cross-platform HTTP client (mobile + web) used to talk to the backend.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
