<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Mobile Collège</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-bar">
    <h1>App Mobile Collège</h1>
    <button id="refresh-btn" class="icon-btn" title="Actualiser" aria-label="Actualiser">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
      </svg>
    </button>
  </header>

  <main id="view" aria-live="polite"></main>

  <!-- Templates: one per application state (loading / success / empty / error) -->
  <template id="tpl-loading">
    <div class="state-view">
      <div class="spinner" role="status" aria-label="Chargement"></div>
      <p>Chargement des cours…</p>
    </div>
  </template>

  <template id="tpl-error">
    <div class="state-view scrollable">
      <svg class="state-icon error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 19A4.5 4.5 0 0 1 6 10.03 6 6 0 0 1 17.7 8.6 4 4 0 0 1 19 16.4"/>
        <line x1="3" y1="3" x2="21" y2="21"/>
      </svg>
      <h2>Oups, un problème est survenu</h2>
      <p id="error-message" class="muted"></p>
      <button id="retry-btn" class="tonal-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
        </svg>
        Réessayer
      </button>
    </div>
  </template>

  <template id="tpl-empty">
    <div class="state-view scrollable">
      <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
      </svg>
      <h2>Aucun cours disponible</h2>
      <p class="muted">Les cours publiés par l’administration apparaîtront ici.</p>
      <button id="empty-refresh-btn" class="tonal-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
        </svg>
        Actualiser
      </button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
