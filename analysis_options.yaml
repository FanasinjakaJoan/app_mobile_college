# Static analysis configuration.
# Builds on the recommended Flutter lint set and layers stricter rules on
# top to keep the codebase clean and consistent.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true

linter:
  rules:
    - always_declare_return_types
    - directives_ordering
    - prefer_single_quotes
    - unawaited_futures
